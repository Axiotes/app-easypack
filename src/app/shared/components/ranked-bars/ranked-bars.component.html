@if (items.length) {
  <ul class="ranked-bars">
    @for (item of sortedItems; track item.label) {
      <li [attr.title]="item.label + ': ' + item.value">
        <span class="ranked-bars__label">{{ item.label }}</span>
        <span class="ranked-bars__track"><span class="ranked-bars__fill" [style.width.%]="percent(item.value)"></span></span>
        <span class="ranked-bars__value">{{ item.value }}</span>
      </li>
    }
  </ul>
} @else {
  <p class="ranked-bars__empty">{{ emptyMessage }}</p>
}
